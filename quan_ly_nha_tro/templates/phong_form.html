{% extends "base.html" %}
{% block content %}
<h1>{{ 'Sửa phòng ' ~ phong.so_phong if phong else 'Thêm phòng' }}</h1>
<div class="card">
<form method="post" class="f">
  <label>Số phòng *<input name="so_phong" required value="{{ phong.so_phong if phong }}"></label>
  <label>Tầng<input name="tang" type="number" min="0" value="{{ phong.tang if phong else 1 }}"></label>
  <label>Diện tích (m²)<input name="dien_tich" type="number" step="0.1" min="0" value="{{ phong.dien_tich if phong else '' }}"></label>
  <label>Giá thuê tháng (đ)<input name="gia_thang" type="number" min="0" value="{{ phong.gia_thang if phong else '' }}"></label>
  <label>Giá thuê ngày (đ)<input name="gia_ngay" type="number" min="0" value="{{ phong.gia_ngay if phong else '' }}"></label>
  <label>Số người tối đa<input name="so_nguoi_toi_da" type="number" min="1" value="{{ phong.so_nguoi_toi_da if phong else 2 }}"></label>
  <label style="grid-column:1/-1">Ghi chú<input name="ghi_chu" value="{{ phong.ghi_chu if phong }}"></label>
  <div><button>Lưu</button> <a class="btn sec" href="{{ url_for('phong_list') }}">Hủy</a></div>
</form>
</div>
{% endblock %}
